services:
  postgres:
    container_name: db_practices
    ports:
      - "5433:5432"
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: app
      POSTGRES_DB: practice
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d practice"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: 